<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JacksonOS AI Terminal</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Change these to match the rest of your site. */
  :root {
    --bg: #0000a8;        /* DOS blue */
    --fg: #c8c8c8;        /* body text */
    --accent: #ffff55;    /* your input and prompt */
    --cyan: #55ffff;      /* system messages */
    --warn: #ff5555;      /* errors */
    --font: 'IBM', monospace;
    
  }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--fg); font-family: var(--font); font-size: 22px; line-height: 1.25; }
  body { padding: 12px; }
  #win { height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); border: 4px double var(--fg); }
  #title { background: var(--fg); color: var(--bg); padding: 0 8px; display: flex; justify-content: space-between; }
  #title a { color: var(--bg); }
  #log { flex: 1; overflow-y: auto; padding: 8px 10px; white-space: pre-wrap; word-wrap: break-word; }
  .you { color: var(--accent); }
  .sys { color: var(--cyan); }
  .err { color: var(--warn); }
  .row { margin-bottom: 8px; }
  #form { display: flex; gap: 8px; padding: 6px 10px; border-top: 2px solid var(--fg); }
  #prompt { color: var(--accent); white-space: nowrap; }
  #in { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--accent); font: inherit; caret-color: var(--accent); caret-shape: block; }
  #form:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cursor::after { content: "\2588"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
  #log a { color: var(--accent); text-decoration: underline; }
  #log a:hover { background: var(--accent); color: var(--bg); }
  #log .fig { display: block; margin: 8px 0; border: 2px solid var(--fg); background: #000; text-decoration: none; color: var(--cyan); }
  #log .fig img { display: block; width: 100%; height: auto; }
  #log .fig span { display: block; padding: 2px 6px; background: var(--fg); color: var(--bg); font-size: 16px; }
</style>
</head>
<body>
  <div id="win">
    <div id="title"><span>JACKSONOS V2.1 - AI TERMINAL</span><span id="mname">MODEL: LLAMA</span></div>
    <div id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <span id="prompt">C:\OBSERVATORY&gt;</span>
      <input id="in" aria-label="Message" autofocus maxlength="1000" spellcheck="false">
    </form>
  </div>
  <script>
    const LINKS = {
      resume:    { label: "Resume (PDF)",     url: "https://jacksonsobservatory.com/resume1.pdf", desc: "Jackson's resume", newTab: true },
      osint:     { label: "OSINT Tracker",    url: "https://jacksonsobservatory.com/projects",    desc: "Projects, including the OSINT tracker" },
      benchmark: { label: "Safety Benchmark", url: "https://github.com/Jucksun/Petrochemical-model-interpretation", desc: "LLM safety & interpretability benchmark" },
      contact:   { label: "Contact",          url: "https://jacksonsobservatory.com/contact",     desc: "Get in touch" },
      home:      { label: "Home",             url: "https://jacksonsobservatory.com/",            desc: "Back to the main site" },
      linktree:  { label: "Linktree",         url: "https://jacksonsobservatory.com/linktree",    desc: "All of Jackson's links" },
      about:     { label: "About",            url: "https://jacksonsobservatory.com/about",       desc: "About Jackson" },
      github:    { label: "GitHub",           url: "https://github.com/Jucksun",                  desc: "Source code and repos" },
    };

  const MEDIA = {
    "benchmark-bars":     { src: "images/graphs/benchmark-bars.png",     alt: "Benchmark pass rates by model and category",           caption: "FIG 1: Behavioral benchmark" },
    "probe-layers":       { src: "images/graphs/probe-layers.png",       alt: "Linear probe accuracy by model depth",                caption: "FIG 2: Entity familiarity probe" },
    "refusal-logit-lens": { src: "images/graphs/refusal-logit-lens.png", alt: "Refusal direction sensitivity and logit lens",        caption: "FIG 3: Refusal vector + logit lens" },
    "gft-covariance":     { src: "images/graphs/gft-covariance.png",     alt: "Covariance heatmaps of GFT of temperature dataset",   caption: "FIG 4: GFT covariance matrices" },
    "error-vs-m-1":       { src: "images/graphs/error-vs-m-1.png",       alt: "Error vs nodes observed per sample",                  caption: "FIG 5: Error vs m (A)" },
    "error-vs-m-2":       { src: "images/graphs/error-vs-m-2.png",       alt: "Error vs nodes observed per sample",                  caption: "FIG 6: Error vs m (B)" },
    "csice-minnesota":    { src: "images/graphs/csice-minnesota.png",    alt: "CSICE channel response recovery, Minnesota road network", caption: "FIG 7: CSICE channel recovery" },
  };

  function makeFigure(m) {
    const a = document.createElement("a");
    a.href = m.src; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.className = "fig";
    const img = document.createElement("img");
    img.src = m.src; img.alt = m.alt; img.loading = "lazy";
    img.onload = () => { log.scrollTop = log.scrollHeight; };
    const cap = document.createElement("span");
    cap.textContent = m.caption + " (click to enlarge)";
    a.append(img, cap);
    return a;
  }

  function makeLink(l) {
    const a = document.createElement("a");
    a.href = l.url;
    a.textContent = "[" + l.label + "]";
    const external = new URL(l.url, location.href).origin !== location.origin;
    if (l.newTab || external) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
    return a;
  }

  function render(el, text, final = false) {
    // hide a half-streamed tag like "[[prob" until it completes
    text = text.replace(/\[{1,2}[^\]]*$/, "");
    el.textContent = "";
    const re = /\[\[\s*(?:(link|img)\s*:\s*)?([\w-]+)\s*\]\]/gi;
    let last = 0, m;
    while ((m = re.exec(text))) {
      el.append(text.slice(last, m.index));
      const id = m[2].toLowerCase();
      let kind = m[1] ? m[1].toLowerCase() : null;
      if (!kind) kind = Object.hasOwn(MEDIA, id) ? "img" : "link";
      if (kind === "link" && Object.hasOwn(LINKS, id)) el.append(makeLink(LINKS[id]));
      if (kind === "img" && final && Object.hasOwn(MEDIA, id)) el.append(makeFigure(MEDIA[id]));
      last = re.lastIndex;
    }
    el.append(text.slice(last));
  }
    
    const API_URL = "https://observatory-terminal.jackson-ramsdell28.workers.dev";

    const log = document.getElementById("log");
    const input = document.getElementById("in");
    const form = document.getElementById("form");
    const mname = document.getElementById("mname");
    const models = ["llama", "mistral", "gemma"];
    
    let model = "llama";
    let history = [];
    let busy = false;

  function render(el, text) {
    // hide a half-streamed tag like "[[lin" until it completes, thanks google
    text = text.replace(/\[{1,2}[^\]]*$/, "");
    el.textContent = "";
    const re = /\[\[link:([\w-]+)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      el.append(text.slice(last, m.index));
      if (Object.hasOwn(LINKS, m[1])) {
        const l = LINKS[m[1]];
        const a = document.createElement("a");
        a.href = l.url;
        a.textContent = "[" + l.label + "]";
        if (/^https?:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
        el.append(a);
      }
      last = re.lastIndex;
    }
    el.append(text.slice(last));
  }
    

    function row(cls, text) {
      const d = document.createElement("div");
      d.className = "row " + cls;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }

    row("sys", "JacksonOS v2.1 AI terminal ready.\nType a question, or /help for commands.");

    function command(line) {
      const [cmd, arg] = line.slice(1).split(/\s+/);
      if (cmd === "return" || cmd === "r") {
        row("sys", "Exiting JacksonOS Terminal -> index.html...");
        window.location.href = "index.html";
        return;
      }
      if (cmd === "clear") { history = []; log.textContent = ""; return; }
      if (cmd === "links") {
        const d = row("sys", "DIRECTORY LISTING:\n");
        for (const l of Object.values(LINKS)) d.append(makeLink(l), " - " + l.desc + "\n");
        return;
      }
      if (cmd === "graphs") {
        const d = row("sys", "FIGURE INDEX:\n");
        for (const m of Object.values(MEDIA)) d.append(makeFigure(m));
        return;
      }
      if (cmd === "model") {
        if (models.includes(arg)) { model = arg; mname.textContent = "MODEL: " + arg.toUpperCase(); row("sys", "Model set to " + arg + "."); }
        else row("err", "Unknown model. Options: " + models.join(", "));
        return;
      }
      row("sys", "/model <llama|mistral|gemma>  switch model\n/links                        list all pages\n/clear                        reset chat\n/return (or /r)               back to index.html");
    }

    function tokenFrom(p) {
      if (typeof p.response === "string") return p.response;
      const c = p.choices && p.choices[0];
      return (c && c.delta && c.delta.content) || "";
    }

    async function send(text) {
      busy = true;
      row("you", "> " + text);
      history.push({ role: "user", content: text });
      const out = row("cursor", "");
      let acc = "";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ model, messages: history }),
        });
        if (!res.ok || !res.body) throw new Error((await res.text()) || res.status);
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (!data || data === "[DONE]") continue;
            try { acc += tokenFrom(JSON.parse(data)); render(out, acc, true); log.scrollTop = log.scrollHeight; } catch {}
          }
        }
        history.push({ role: "assistant", content: acc });
      } catch (e) {
        out.className = "row err";
        out.textContent = "ERROR: " + e.message;
        history.pop();
      }
      out.classList.remove("cursor");
      busy = false;
      input.focus();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      text.startsWith("/") ? command(text) : send(text);
    });
  </script>

  <p><a style="color: #FFFFFF;" href="index.html">Home Page</a></p>

  <div class="win95-taskbar">
      <button class="start-button">
          <img src="https://win95icons.com/png/windows-0.png" width="16" height="16" alt="win">
          <b>Return</b>
      </button>
      <div class="taskbar-divider"></div>
      <div class="taskbar-item active">
          <img src="https://win95icons.com/png/directory_open_file_directory_cool-0.png" width="14" height="14" alt="folder">
          C:\Directory.exe
      </div>
  </div>
</body>
</html>
