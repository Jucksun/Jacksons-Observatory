<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JacksonOS AI Terminal</title>
<link rel="stylesheet" href="style.css" />
<style>
  :root {
    --bg: #0000a8;        /* DOS blue */
    --fg: #c8c8c8;        /* body text */
    --accent: #ffff55;    /* your input and prompt */
    --cyan: #55ffff;      /* system messages */
    --warn: #ff5555;      /* errors */
    --font: 'IBM', monospace;
  }
  html[data-theme=green] { --bg:#001a00; --fg:#33ff33; --accent:#ccffcc; --cyan:#66ff99; }
  html[data-theme=amber] { --bg:#1a0f00; --fg:#ffb000; --accent:#ffd966; --cyan:#ffcc66; }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--fg); font-family: var(--font); font-size: 22px; line-height: 1.25; }
  body { padding: 12px; }
  #win { height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); border: 4px double var(--fg); }
  #title { background: var(--fg); color: var(--bg); padding: 0 8px; display: flex; justify-content: space-between; }
  #log { flex: 1; overflow-y: auto; padding: 8px 10px; white-space: pre-wrap; word-wrap: break-word; }
  .you { color: var(--accent); }
  .sys { color: var(--cyan); }
  .err { color: var(--warn); }
  .row { margin-bottom: 8px; }
  #form { display: flex; gap: 8px; padding: 6px 10px; border-top: 2px solid var(--fg); }
  #prompt { color: var(--accent); white-space: nowrap; }
  #in { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--accent); font: inherit; caret-color: var(--accent); caret-shape: block; }
  #form:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cursor::after { content: "\2588"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
  #log a { color: var(--accent); text-decoration: underline; }
  #log a:hover, .chip:hover, .copy:hover { background: var(--accent); color: var(--bg); }
  #log .fig { display: block; margin: 8px 0; border: 2px solid var(--fg); background: #000; text-decoration: none; color: var(--cyan); }
  #log .fig img { display: block; width: 100%; height: auto; }
  #log .fig span { display: block; padding: 2px 6px; background: var(--fg); color: var(--bg); font-size: 16px; }
  .box { border: 2px solid var(--fg); background: #fff; color: var(--cyan); padding: 6px 8px; margin: 8px 0; overflow-x: auto; }
  .box b { color: var(--bg); }
  code { background: #000; color: var(--cyan); padding: 0 3px; }
  .chips { margin-top: 6px; }
  .chip, .copy { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0 6px 0 0; text-align: left; text-decoration: underline; }
  .copy { display: block; margin-top: 4px; }
</style>
</head>
<body>
  <div id="win">
    <div id="title"><span>JACKSONOS V2.1 - AI TERMINAL</span><span id="mname">MODEL: LLAMA</span></div>
    <div id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <span id="prompt">C:\OBSERVATORY&gt;</span>
      <input id="in" aria-label="Message" autofocus maxlength="1000" spellcheck="false">
    </form>
  </div>
  <script>
    const API_URL = "https://observatory-terminal.jackson-ramsdell28.workers.dev";

    // Filled at boot from GET /registry (defined in the worker's registry.js).
    let REG = { links: {}, figures: {}, charts: {}, cards: {}, suggestions: [] };

    const $ = (id) => document.getElementById(id);
    const log = $("log"), input = $("in"), form = $("form"), mname = $("mname");
    const models = ["llama", "mistral", "gemma"];
    let model = "llama", history = [], busy = false;

    const store = {
      get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    };
    const scroll = () => { log.scrollTop = log.scrollHeight; };
    const mk = (tag, cls, txt) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt != null) e.textContent = txt;
      return e;
    };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // ---------- block builders ----------
    function makeFigure(m) {
      const a = mk("a", "fig");
      a.href = m.src; a.target = "_blank"; a.rel = "noopener noreferrer";
      const img = mk("img");
      img.src = m.src; img.alt = m.alt; img.loading = "lazy"; img.onload = scroll;
      a.append(img, mk("span", null, m.caption + " (click to enlarge)"));
      return a;
    }

    function makeLink(l) {
      const a = mk("a", null, "[" + l.label + "]");
      a.href = l.url;
      if (l.newTab || new URL(l.url, location.href).origin !== location.origin) {
        a.target = "_blank"; a.rel = "noopener noreferrer";
      }
      return a;
    }

    function makeChart(c) {
      const W = 20;
      let t = c.title + "\n" + "─".repeat(c.title.length) + "\n";
      for (const [g, rows] of Object.entries(c.groups)) {
        Object.entries(rows).forEach(([name, v], i) => {
          const f = Math.round((v / c.max) * W);
          t += (i ? "" : g).padEnd(10) + name.padEnd(7) + "█".repeat(f) + "░".repeat(W - f) + " " + v + c.unit + "\n";
        });
        t += "\n";
      }
      return mk("div", "box chart", t + (c.note || ""));
    }

    function makeCard(c) {
      const d = mk("div", "box");
      d.append(mk("b", null, c.title + "\n"), "STATUS: " + c.status + "\nSTACK:  " + c.stack + "\n" + c.blurb + "\n");
      (c.links || []).forEach((id) => REG.links[id] && d.append(makeLink(REG.links[id]), " "));
      return d;
    }

    function makeChips(list) {
      const d = mk("div", "chips");
      list.slice(0, 3).forEach((q) => {
        const b = mk("button", "chip", "[" + q + "]");
        b.type = "button";
        b.onclick = () => { if (!busy) send(q); };
        d.append(b);
      });
      return d;
    }

    // ---------- light markdown: **bold**, `code`, ```fences```, "- " bullets ----------
    function md(text) {
      const f = document.createDocumentFragment();
      text.split(/(```[\s\S]*?(?:```|$))/).forEach((part) => {
        if (part.startsWith("```")) {
          const code = part.replace(/^```\w*\n?/, "").replace(/```$/, "");
          const w = mk("div", "box", code);
          const b = mk("button", "copy", "[COPY]");
          b.type = "button";
          b.onclick = () => navigator.clipboard.writeText(code).then(() => { b.textContent = "[COPIED]"; });
          w.append(b); f.append(w);
          return;
        }
        part.replace(/^[ \t]*[-*] /gm, "• ").split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/).forEach((s) => {
          if (/^\*\*.+\*\*$/.test(s)) f.append(mk("b", null, s.slice(2, -2)));
          else if (/^`.+`$/.test(s)) f.append(mk("code", null, s.slice(1, -1)));
          else f.append(s);
        });
      });
      return f;
    }

    // ---------- tag renderer: [[type:id]] -> block. Add a type by adding a table entry. ----------
    const TABLES = { link: "links", img: "figures", chart: "charts", card: "cards" };
    const BUILD = { link: makeLink, img: makeFigure, chart: makeChart, card: makeCard };
    const FINAL_ONLY = new Set(["img", "chart", "card"]); // heavy blocks appear after streaming ends
    const TAG = /\[\[\s*(?:(link|img|chart|card|ask)\s*:\s*)?([^\]\[]+?)\s*\]\]/gi;

    function render(out, text, final = false) {
      text = text.replace(/\[{1,2}[^\]]*$/, ""); // hide a half-streamed tag
      out.textContent = "";
      const asks = [];
      let last = 0, m;
      TAG.lastIndex = 0;
      while ((m = TAG.exec(text))) {
        out.append(md(text.slice(last, m.index)));
        last = TAG.lastIndex;
        let kind = (m[1] || "").toLowerCase(), id = m[2].trim();
        if (kind === "ask") { asks.push(id); continue; }
        id = id.toLowerCase();
        if (!kind) kind = Object.keys(TABLES).find((k) => Object.hasOwn(REG[TABLES[k]], id));
        const item = kind && Object.hasOwn(REG[TABLES[kind]], id) && REG[TABLES[kind]][id];
        if (!item || (FINAL_ONLY.has(kind) && !final)) continue;
        out.append(BUILD[kind](item));
      }
      out.append(md(text.slice(last)));
      if (final && asks.length) out.append(makeChips(asks));
    }

    // Deterministic routing: if the question mentions a registry keyword, attach it even if the model forgot.
    function autoTags(q, reply) {
      const have = reply.toLowerCase();
      let add = "", n = 0;
      for (const [kind, tbl] of [["link", REG.links], ["img", REG.figures], ["chart", REG.charts]]) {
        for (const [id, o] of Object.entries(tbl)) {
          const re = o.keywords && new RegExp("\\b(" + o.keywords.join("|") + ")", "i");
          if (n < 2 && re && re.test(q) && !have.includes(id + "]]")) { add += " [[" + kind + ":" + id + "]]"; n++; }
        }
      }
      return reply + add;
    }

    function row(cls, text) {
      const d = mk("div", "row " + cls, text);
      log.appendChild(d);
      scroll();
      return d;
    }

    // ---------- slash commands (the table also generates /help) ----------
    function setTheme(t) { document.documentElement.dataset.theme = t; store.set("theme", t); }
    const THEMES = ["dos", "green", "amber"];
    const need = (arg, what) => row("err", "Usage: " + what);

    const COMMANDS = {
      help:     ["", "list commands", () => row("sys", Object.entries(COMMANDS).map(([k, v]) => ("/" + k + " " + v[0]).padEnd(26) + v[1]).join("\n"))],
      links:    ["", "list all pages", () => { const d = row("sys", "DIRECTORY LISTING:\n"); for (const l of Object.values(REG.links)) d.append(makeLink(l), " - " + l.desc + "\n"); }],
      graphs:   ["", "list all figures", () => { const d = row("sys", "FIGURE INDEX:\n"); for (const m of Object.values(REG.figures)) d.append(makeFigure(m)); }],
      figure:   ["<n>", "show figure n", (a) => { const m = Object.values(REG.figures)[(+a || 0) - 1]; m ? row("sys", "").append(makeFigure(m)) : need(a, "/figure 1-" + Object.keys(REG.figures).length); }],
      chart:    ["", "benchmark bar chart", () => row("sys", "").append(makeChart(REG.charts.benchmark))],
      project:  ["[id]", "project cards", (a) => { const d = row("sys", ""); const c = REG.cards[a]; if (a && !c) return need(a, "/project <" + Object.keys(REG.cards).join("|") + ">"); (c ? [c] : Object.values(REG.cards)).forEach((x) => d.append(makeCard(x))); }],
      resume:   ["", "open resume", () => row("sys", "").append(makeLink(REG.links.resume))],
      model:    ["<llama|mistral|gemma>", "switch model", (a) => { if (models.includes(a)) { model = a; store.set("model", a); mname.textContent = "MODEL: " + a.toUpperCase(); row("sys", "Model set to " + a + "."); } else row("err", "Unknown model. Options: " + models.join(", ")); }],
      theme:    ["<dos|green|amber>", "change colors", (a) => THEMES.includes(a) ? (setTheme(a), row("sys", "Theme: " + a)) : row("err", "Options: " + THEMES.join(", "))],
      whoami:   ["", "who are you", () => row("sys", "guest@observatory\nPRIVILEGES: read-only, ask-anything\nUPTIME: " + Math.round(performance.now() / 1000) + "s")],
      export:   ["", "download transcript", () => { const a = mk("a"); a.href = URL.createObjectURL(new Blob([history.map((m) => (m.role === "user" ? "> " : "") + m.content).join("\n\n")], { type: "text/plain" })); a.download = "jacksonos-transcript.txt"; a.click(); }],
      clear:    ["", "reset chat", () => { history = []; log.textContent = ""; }],
      return:   ["", "back to index.html (/r)", () => { row("sys", "Exiting JacksonOS Terminal -> index.html..."); location.href = "index.html"; }],
    };
    const ALIAS = { r: "return" };

    function command(line) {
      const [raw, arg = ""] = line.slice(1).trim().toLowerCase().split(/\s+/);
      const c = COMMANDS[ALIAS[raw] || raw];
      if (!c) return row("err", "Bad command or file name. Try /help");
      c[2](arg);
    }

    // ---------- chat ----------
    function tokenFrom(p) {
      if (typeof p.response === "string") return p.response;
      const c = p.choices && p.choices[0];
      return (c && c.delta && c.delta.content) || "";
    }

    async function send(text) {
      busy = true;
      row("you", "> " + text);
      history.push({ role: "user", content: text });
      const out = row("cursor", "");
      let acc = "", ok = false;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ model, messages: history }),
        });
        if (!res.ok || !res.body) throw new Error((await res.text()) || res.status);
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (!data || data === "[DONE]") continue;
            try { acc += tokenFrom(JSON.parse(data)); render(out, acc); scroll(); } catch {}
          }
        }
        acc = autoTags(text, acc);
        render(out, acc, true);
        history.push({ role: "assistant", content: acc.replace(/\[\[ask:[^\]]*\]\]/gi, "").trim() });
        ok = true;
      } catch (e) {
        out.className = "row err";
        out.textContent = "ERROR: " + e.message;
      } finally {
        if (!ok) history.pop();
        out.classList.remove("cursor");
        busy = false;
        scroll();
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      text.startsWith("/") ? command(text) : send(text);
    });

    // ---------- boot ----------
    (async function boot() {
      busy = true;
      const t = store.get("theme"); if (THEMES.includes(t)) setTheme(t);
      const mdl = store.get("model"); if (models.includes(mdl)) { model = mdl; mname.textContent = "MODEL: " + mdl.toUpperCase(); }
      const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
      for (const l of ["JACKSONOS V2.1 BIOS OK", "MEMORY CHECK... 640K OK", "LOADING MODEL: " + model.toUpperCase() + "..."]) {
        row("sys", l);
        if (!fast) await sleep(160);
      }
      try {
        const r = await fetch(API_URL + "/registry");
        if (!r.ok) throw new Error();
        REG = await r.json();
      } catch { row("err", "WARNING: registry offline. Links and figures disabled."); }
      const d = row("sys", "READY. Ask a question, tap a suggestion, or type /help.");
      d.append(makeChips(REG.suggestions || []));
      busy = false;
      input.focus();
    })();
  </script>

  <p><a style="color: #FFFFFF;" href="index.html">Home Page</a></p>

  <div class="win95-taskbar">
      <button class="start-button">
          <img src="https://win95icons.com/png/windows-0.png" width="16" height="16" alt="win">
          <b>Return</b>
      </button>
      <div class="taskbar-divider"></div>
      <div class="taskbar-item active">
          <img src="https://win95icons.com/png/directory_open_file_directory_cool-0.png" width="14" height="14" alt="folder">
          C:\Directory.exe
      </div>
  </div>
</body>
</html>
